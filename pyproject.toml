[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxotradex-options-agent"
version = "0.1.0"
description = "Oxotradex: Autonomous AI options trading agent for Alpaca Trading API with deterministic risk gates"
readme = "README.md"
authors = [{ name = "Quant AI Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.38.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "plotly>=5.22.0",
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pytest>=8.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0"
]
